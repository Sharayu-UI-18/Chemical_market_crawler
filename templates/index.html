<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Buy vs Synthesize</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container py-5" style="max-width:1050px;">

    <!-- ================= HERO ================= -->

    <div class="text-center mb-4">

        

        <h1 class="display-5 fw-bold text-white">
            Buy vs Synthesize
        </h1>

        <p class="fs-5 text-light mt-2 mb-0">
            Compare market availability of research chemicals across
            leading global suppliers using CAS numbers.
        </p>

    </div>

    <!-- ================= SEARCH ================= -->

    <div class="row justify-content-center mb-5">

        <div class="col-lg-9">

            <div class="card shadow-sm">

                <div class="card-body">

                    <div class="row g-3 align-items-center">

                        <div class="col-md-9">

                            <input
                                id="casInput"
                                class="form-control shadow-sm"
                                placeholder="Enter CAS Number (e.g. 50-78-2)">

                        </div>

                        <div class="col-md-3 d-grid">

                            <button
                                id="searchBtn"
                                class="btn btn-primary">

                                Analyze

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ================= RESULTS ================= -->

    <div id="loading" class="text-center my-5" style="display:none;">

    <div class="loader"></div>

    <h5 class="text-white mt-4">
        Searching Supplier Databases...
    </h5>

    <p class="text-light">
        Comparing market availability across global suppliers.
    </p>

</div>

    <div id="results" style="display:none;">

        <!-- Market Availability -->
        <div id="summaryCard" class="mb-4"></div>

        <!-- Compound Details -->
        <div id="compoundCard" class="mb-4"></div>

        <!-- Supplier Table -->

        <div class="card shadow-sm mb-4">

            <div class="card-header">

                <h5 class="mb-0">
                    📋 Market Availability by Supplier
                </h5>

            </div>

            <div class="card-body">

                <div class="table-responsive">

                    <table class="table table-hover align-middle">

                        <thead class="table-light">

                            <tr>

                                <th>Supplier</th>

                                <th>Status</th>

                                <th>Catalog No.</th>

                                <th>Shipping</th>

                                <th>Product</th>

                            </tr>

                        </thead>

                        <tbody id="supplierTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

        <!-- Recommendation -->

        <div id="recommendationCard"></div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>

</html>
